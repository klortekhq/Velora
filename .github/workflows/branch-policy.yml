name: Comprobar política de ramas

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  only-main:
    name: Solo rama pública main
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar ramas remotas
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t branches < <(
            git -c "http.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" \
              ls-remote --heads "https://github.com/${GITHUB_REPOSITORY}.git" |
              awk '{sub("refs/heads/", "", $2); print $2}' |
              sort
          )
          if [ "${#branches[@]}" -ne 1 ] || [ "${branches[0]}" != "main" ]; then
            printf 'Ramas públicas encontradas:\n'
            printf ' - %s\n' "${branches[@]}"
            echo 'La política de Velora exige que la única rama pública sea main.'
            exit 1
          fi
          echo 'Política de ramas correcta: solo main.'
