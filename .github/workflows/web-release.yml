name: Velora web packages

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform package to prepare
        required: true
        default: all
        type: choice
        options: [all, samsung, webos, vidaa]
      release_tag:
        description: 'Etiqueta existente que se quiere reconstruir y publicar (por ejemplo, v1.4.0). Vacío = QA sin release.'
        required: false
        type: string
        default: ''
  push:
    branches:
      - main
    tags:
      # Keep public releases focused on meaningful product milestones.
      - 'v?.?.0'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-release.yml'

permissions:
  contents: write

# Keep web validation independent from Android, but serialize publication
# because both workflows add artifacts to the same tag release.
concurrency:
  group: velora-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare common web client
        run: |
          node web/scripts/test-platform.mjs
          node web/scripts/build-web.mjs "${{ inputs.platform || 'all' }}"
      - name: Package source
        run: |
          mkdir -p dist
          package="${{ inputs.platform || 'all' }}"
          version="$(node -p "require('./web/package.json').version")"

          # Always publish the browser client and the complete platform bundle
          # together. The Android workflow contributes the four APKs to the
          # same tag release.
          tar -czf "dist/Velora-Web-${package}.tar.gz" -C outputs/web .
          (cd outputs/web && zip -qr "../../dist/Velora-Web-${package}.zip" .)

          if [ -d outputs/web/samsung ]; then
            (cd outputs/web/samsung && zip -qr "../../../dist/Velora-samsung-bundle-${version}.zip" .)
          fi
          if [ -d outputs/web/vidaa ]; then
            (cd outputs/web/vidaa && zip -qr "../../../dist/Velora-vidaa-bundle-${version}.zip" .)
          fi
          if compgen -G 'outputs/web/webos/*.ipk' > /dev/null; then
            cp "$(compgen -G 'outputs/web/webos/*.ipk' | head -n 1)" "dist/Velora-webos-${version}.ipk"
          elif [ -d outputs/web/webos ]; then
            (cd outputs/web/webos && zip -qr "../../../dist/Velora-webos-bundle-${version}.zip" .)
          fi
          sha256sum dist/* > dist/SHA256SUMS-web.txt
      - name: Limpiar bundles Smart TV obsoletos de la release
        if: startsWith(env.RELEASE_TAG, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./web/package.json').version")"
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" 2>/dev/null || true)"
          if [ -z "$release_json" ]; then
            exit 0
          fi
          stale_ids="$(printf '%s' "$release_json" | jq -r --arg version "$version" '
            (.assets // [])[]
            | select(.name | test("^Velora-(samsung|vidaa)-bundle-|^Velora-webos-(bundle-)?"))
            | select(.name | test("-" + $version + "\\.(zip|ipk)$") | not)
            | .id')"
          for asset_id in $stale_ids; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          done
      - name: Publicar paquetes web en la release
        if: startsWith(env.RELEASE_TAG, 'v')
        uses: softprops/action-gh-release@v2
        with:
          name: Velora ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: false
          body: |
            Cambios principales de esta versión:

            - Reproducción con Media3/ExoPlayer como motor predeterminado y decisión Original First.
            - Experiencia diferenciada para móvil/tablet y Android TV/Fire TV.
            - Live TV, subtítulos, pistas de audio, reanudación y controles de reproducción.
            - Descargas offline gestionadas por Velora únicamente en móvil y tablet.
            - Mejoras de seguridad, localización y rendimiento.

            Consulta el dashboard de progreso para conocer el estado de validación por plataforma.
          files: dist/*
