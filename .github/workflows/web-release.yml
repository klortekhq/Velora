name: Velora web packages

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform package to prepare
        required: true
        default: all
        type: choice
        options: [all, samsung, webos, vidaa]
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'web/**'
      - '.github/workflows/web-release.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-release.yml'

permissions:
  contents: write

# Serialize with the Android release workflow so both sets of assets land in
# the same GitHub release without create/update races.
concurrency:
  group: velora-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare common web client
        run: |
          node web/scripts/test-platform.mjs
          node web/scripts/build-web.mjs "${{ inputs.platform || 'all' }}"
      - name: Package source
        run: |
          mkdir -p dist
          package="${{ inputs.platform || 'all' }}"
          version="$(node -p "require('./web/package.json').version")"

          # Always publish the browser client and the complete platform bundle
          # together. The Android workflow contributes the four APKs to the
          # same tag release.
          tar -czf "dist/Velora-Web-${package}.tar.gz" -C outputs/web .
          (cd outputs/web && zip -qr "../../dist/Velora-Web-${package}.zip" .)

          if [ -d outputs/web/samsung ]; then
            (cd outputs/web/samsung && zip -qr "../../../dist/Velora-samsung-bundle-${version}.zip" .)
          fi
          if [ -d outputs/web/vidaa ]; then
            (cd outputs/web/vidaa && zip -qr "../../../dist/Velora-vidaa-bundle-${version}.zip" .)
          fi
          if [ -f outputs/web/webos/*.ipk ]; then
            cp outputs/web/webos/*.ipk "dist/Velora-webos-${version}.ipk"
          elif [ -d outputs/web/webos ]; then
            (cd outputs/web/webos && zip -qr "../../../dist/Velora-webos-bundle-${version}.zip" .)
          fi
          sha256sum dist/* > dist/SHA256SUMS-web.txt
      - name: Guardar artefactos web
        uses: actions/upload-artifact@v4
        with:
          name: Velora-Web-${{ inputs.platform || 'all' }}
          path: dist/
      - name: Publicar paquetes web en la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Velora ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/Velora-Web-${{ inputs.platform || 'all' }}.tar.gz
            dist/Velora-Web-${{ inputs.platform || 'all' }}.zip
            dist/Velora-samsung-bundle-*.zip
            dist/Velora-vidaa-bundle-*.zip
            dist/Velora-webos-*.ipk
            dist/Velora-webos-bundle-*.zip
            dist/SHA256SUMS-web.txt
