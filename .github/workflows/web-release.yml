name: Velora web packages

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform package to prepare
        required: true
        default: all
        type: choice
        options: [all, samsung, webos, vidaa]

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare common web client
        run: node web/scripts/build-web.mjs ${{ inputs.platform }}
      - name: Package source
        run: |
          mkdir -p dist
          tar -czf dist/Velora-Web-${{ inputs.platform }}.tar.gz -C outputs/web .
          sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Publish private release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: velora-web-${{ github.run_number }}
          name: Velora Web ${{ inputs.platform }}
          generate_release_notes: true
          files: |
            dist/Velora-Web-${{ inputs.platform }}.tar.gz
            dist/SHA256SUMS.txt
