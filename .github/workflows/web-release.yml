name: Velora web packages

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform package to prepare
        required: true
        default: all
        type: choice
        options: [all, samsung, webos, vidaa]
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'web/**'
      - '.github/workflows/web-release.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-release.yml'

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare common web client
        run: |
          node web/scripts/test-platform.mjs
          node web/scripts/build-web.mjs "${{ inputs.platform || 'all' }}"
      - name: Package source
        run: |
          mkdir -p dist
          package="${{ inputs.platform || 'all' }}"
          tar -czf "dist/Velora-Web-${package}.tar.gz" -C outputs/web .
          sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Guardar artefactos web
        uses: actions/upload-artifact@v4
        with:
          name: Velora-Web-${{ inputs.platform || 'all' }}
          path: dist/
      - name: Publicar paquetes web en la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Velora ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/Velora-Web-${{ inputs.platform || 'all' }}.tar.gz
            dist/SHA256SUMS.txt
