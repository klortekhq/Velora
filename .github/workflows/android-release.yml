name: Publicar APK de Velora

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Compilar y publicar APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permisos al wrapper
        run: chmod +x ./gradlew

      - name: Compilar APK debug y release unsigned
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Preparar nombres de APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Velora-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/Velora-release-unsigned.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Guardar artefactos de compilación
        uses: actions/upload-artifact@v4
        with:
          name: Velora-APK-${{ github.ref_name }}
          path: dist/

      - name: Crear o actualizar release con los APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Velora-debug.apk
            dist/Velora-release-unsigned.apk
            dist/SHA256SUMS.txt
