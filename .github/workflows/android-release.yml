name: Publicar APK de Velora

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'

permissions:
  contents: write

# Android and web publish into the same tag release. The workflow-specific
# group prevents a queued validation run from cancelling the other platform.
concurrency:
  group: velora-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Compilar y publicar APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permisos al wrapper
        run: chmod +x ./gradlew

      - name: Verificar versión de la etiqueta
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          android_version="$(awk -F'"' '/versionName =/{print $2; exit}' app/build.gradle.kts)"
          web_version="$(node -p "require('./web/package.json').version")"
          echo "Tag=\${tag_version} Android=\${android_version} Web=\${web_version}"
          test "$tag_version" = "$android_version" || { echo "Tag $tag_version != Android $android_version"; exit 1; }
          test "$tag_version" = "$web_version" || { echo "Tag $tag_version != web $web_version"; exit 1; }

      - name: Compilar APK móvil/TV debug y release unsigned
        run: |
          # Bound Gradle and clean up its worker tree when a hosted runner
          # stops making progress. Without this, a child Kotlin/CMake process
          # can survive the wrapper timeout and leave the release job running.
          set -o errexit
          cleanup_gradle() {
            pkill -TERM -P "$BASHPID" 2>/dev/null || true
          }
          trap cleanup_gradle EXIT
          timeout --foreground --signal=TERM --kill-after=30s 25m ./gradlew \
            :app:testMobileDebugUnitTest :app:testTvDebugUnitTest \
            :app:assembleMobileDebug :app:assembleTvDebug \
            :app:assembleMobileRelease :app:assembleTvRelease \
            --no-daemon --max-workers=1 --console=plain --stacktrace

      - name: Preparar nombres de APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/mobile/debug/app-mobile-debug.apk dist/Velora-mobile-debug.apk
          cp app/build/outputs/apk/tv/debug/app-tv-debug.apk dist/Velora-tv-debug.apk
          cp app/build/outputs/apk/mobile/release/velora-release-unsigned.apk dist/Velora-mobile-release-unsigned.apk
          cp app/build/outputs/apk/tv/release/velora-release-unsigned.apk dist/Velora-tv-release-unsigned.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Guardar artefactos de compilación
        uses: actions/upload-artifact@v4
        with:
          name: Velora-APK-${{ github.ref_name }}-${{ github.run_id }}
          path: dist/

      - name: Crear o actualizar release con los APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Velora-mobile-debug.apk
            dist/Velora-tv-debug.apk
            dist/Velora-mobile-release-unsigned.apk
            dist/Velora-tv-release-unsigned.apk
            dist/SHA256SUMS.txt
