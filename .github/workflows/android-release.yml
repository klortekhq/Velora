name: Publicar APK de Velora

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'

permissions:
  contents: write

# Android and web publish into the same tag release. The workflow-specific
# group prevents a queued validation run from cancelling the other platform.
concurrency:
  group: velora-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Compilar y publicar APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permisos al wrapper
        run: chmod +x ./gradlew

      - name: Compilar APK móvil/TV debug y release unsigned
        run: >-
          ./gradlew :app:testMobileDebugUnitTest
          :app:assembleMobileDebug :app:assembleTvDebug
          :app:assembleMobileRelease :app:assembleTvRelease
          --no-daemon --stacktrace

      - name: Preparar nombres de APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/mobile/debug/app-mobile-debug.apk dist/Velora-mobile-debug.apk
          cp app/build/outputs/apk/tv/debug/app-tv-debug.apk dist/Velora-tv-debug.apk
          cp app/build/outputs/apk/mobile/release/velora-release-unsigned.apk dist/Velora-mobile-release-unsigned.apk
          cp app/build/outputs/apk/tv/release/velora-release-unsigned.apk dist/Velora-tv-release-unsigned.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Guardar artefactos de compilación
        uses: actions/upload-artifact@v4
        with:
          name: Velora-APK-${{ github.ref_name }}
          path: dist/

      - name: Crear o actualizar release con los APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Velora-mobile-debug.apk
            dist/Velora-tv-debug.apk
            dist/Velora-mobile-release-unsigned.apk
            dist/Velora-tv-release-unsigned.apk
            dist/SHA256SUMS.txt
