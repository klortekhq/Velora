name: Sincronizar APK QA Android

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradlew'
      - 'scripts/check-android-*.mjs'
      - 'scripts/check-release-workflows.mjs'
      - 'scripts/reconcile-android-qa.mjs'
      - 'scripts/tests/android-qa*.test.mjs'
      - '.github/workflows/android-qa-reconcile.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Pre-release existente que se actualizará (por ejemplo, v1.4.0)'
        required: false
        type: string
        default: v1.4.0

permissions:
  contents: write

concurrency:
  group: velora-android-qa-${{ inputs.release_tag || 'v1.4.0' }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: Compilar y sincronizar APK QA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VELORA_RELEASE_TAG: ${{ inputs.release_tag || 'v1.4.0' }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Probar publicador QA con GitHub simulado
        run: node --test scripts/tests/android-qa*.test.mjs

      - name: Configurar Android SDK
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -x "$sdk_root/cmdline-tools/latest/bin/sdkmanager" || {
            echo "No se encontró sdkmanager en $sdk_root" >&2
            exit 1
          }
          {
            echo "ANDROID_HOME=$sdk_root"
            echo "ANDROID_SDK_ROOT=$sdk_root"
          } >> "$GITHUB_ENV"
          {
            echo "$sdk_root/cmdline-tools/latest/bin"
            echo "$sdk_root/platform-tools"
          } >> "$GITHUB_PATH"
          yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Instalar plataforma Android
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validar contratos Android
        run: |
          node scripts/check-android-locales.mjs
          node scripts/check-android-playback-policy.mjs
          node scripts/check-release-workflows.mjs

      - name: Compilar y probar variantes QA
        run: >-
          timeout --foreground --signal=TERM --kill-after=30s 20m bash ./gradlew
          :app:testMobileDebugUnitTest
          :app:testTvDebugUnitTest
          :app:assembleMobileDebug
          :app:assembleTvDebug
          --no-daemon --max-workers=1 --console=plain

      - name: Reconciliar APK, checksums y manifest QA en la pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/reconcile-android-qa.mjs
