name: Sincronizar APK QA Android

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Pre-release existente que se actualizará (por ejemplo, v1.4.0)'
        required: false
        type: string
        default: v1.4.0

permissions:
  contents: write

concurrency:
  group: velora-android-qa-${{ inputs.release_tag || 'v1.4.0' }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: Compilar y sincronizar APK QA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VELORA_RELEASE_TAG: ${{ inputs.release_tag || 'v1.4.0' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permisos al wrapper
        run: chmod +x ./gradlew

      - name: Validar contratos Android
        run: |
          node scripts/check-android-locales.mjs
          node scripts/check-android-playback-policy.mjs
          node scripts/check-release-workflows.mjs

      - name: Compilar y probar variantes QA
        run: >-
          timeout --foreground --signal=TERM --kill-after=30s 20m ./gradlew
          :app:testMobileDebugUnitTest
          :app:testTvDebugUnitTest
          :app:assembleMobileDebug
          :app:assembleTvDebug
          --no-daemon --max-workers=1 --console=plain

      - name: Reconciliar APK y checksums en la pre-release
        run: node scripts/reconcile-android-qa.mjs
