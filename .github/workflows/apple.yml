name: Velora Apple validation

on:
  push:
    branches: [main]
    tags: ['v?.?.0']
  pull_request:
    paths:
      - 'apple/**'
      - '.github/workflows/apple.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-package:
    runs-on: macos-14
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar toolchain Swift
        run: swift --version
      - name: Compilar paquete Apple
        run: swift build
      - name: Ejecutar tests del paquete Apple
        run: swift test
